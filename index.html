<title>El Oráculo Cromático · Phtalo Vivo</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#f9f4ff;background:#0D0D18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 15%,#49236e 0,transparent 42%),radial-gradient(ellipse at 90% 80%,#064e55 0,transparent 48%),#0D0D18;background-attachment:fixed}body:before{content:"";pointer-events:none;position:fixed;inset:0;opacity:.38;background-image:radial-gradient(circle at 12% 18%,#fff 1px,transparent 2px),radial-gradient(circle at 72% 24%,#fff 1px,transparent 2px),radial-gradient(circle at 48% 65%,#00C9C4 1px,transparent 2px),radial-gradient(circle at 87% 74%,#FFD60A 1px,transparent 2px);background-size:240px 260px,330px 290px,390px 340px,410px 370px;animation:twinkle 8s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.12}}main{position:relative;max-width:1080px;margin:auto;padding:35px 20px 65px}.eyebrow{color:#00C9C4;font-size:.72rem;letter-spacing:.28em;font-weight:850;text-align:center}h1{text-align:center;font-size:clamp(2.25rem,7vw,4.8rem);line-height:1.06;letter-spacing:-.045em;margin:14px 0 12px;text-shadow:0 0 40px #aa68ff80}header p{text-align:center;color:#d7cde7;max-width:580px;margin:0 auto 26px;line-height:1.6}.sigil{text-align:center;color:#FFD60A;font-size:1.6rem;letter-spacing:1.3em;margin:14px 0 25px;padding-left:1.3em}.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,2.5vw,26px)}.slot{min-width:0;--accent:#6D3DFF}.category{text-align:center;text-transform:uppercase;color:#f6eefe;letter-spacing:.14em;font-size:clamp(.62rem,1.5vw,.83rem);font-weight:800;margin:0 0 14px}.card{width:100%;aspect-ratio:3/4.4;min-height:190px;position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;border:2px solid color-mix(in srgb,var(--accent) 70%,#f7d9ff);border-radius:22px;background:radial-gradient(ellipse at 50% 38%,color-mix(in srgb,var(--accent) 30%,#211638),#121024 85%);color:#fff;padding:23px;box-shadow:0 14px 38px #0008,0 0 24px color-mix(in srgb,var(--accent) 20%,transparent);cursor:pointer;transition:transform .3s,box-shadow .3s}.card:before{content:"";position:absolute;inset:9px;border:1px solid #ffffff65;border-radius:14px;pointer-events:none;z-index:2}.card:after{content:"✦      ✧      ✦";position:absolute;bottom:16px;left:0;right:0;color:#ffdf82;font-size:clamp(.65rem,1.7vw,1rem);letter-spacing:.15em;pointer-events:none;z-index:2}.card:hover:not(:disabled){transform:translateY(-7px);box-shadow:0 23px 45px #0009,0 0 30px color-mix(in srgb,var(--accent) 40%,transparent)}.card:active:not(:disabled){transform:scale(.98)}.card.revealed{background:radial-gradient(ellipse at 45% 35%,color-mix(in srgb,var(--accent) 55%,#3c1a63),#141021 95%)}.card.locked{border-color:#FFD60A;box-shadow:0 0 0 3px #FFD60A55,0 15px 35px #0009}.card.locked:after{content:"✦  SELLADA  ✦";font-size:.7rem;letter-spacing:.15em}.symbol{font-size:clamp(2.3rem,6vw,4.8rem);color:#ffe5a2;text-shadow:0 0 26px #ffd60a80;position:relative;z-index:1}.card-text{font-size:clamp(.9rem,2.25vw,1.55rem);font-weight:850;line-height:1.22;overflow-wrap:anywhere;position:relative;z-index:1;text-shadow:0 2px 9px #0007}.card-hint{font-size:clamp(.6rem,1.3vw,.77rem);opacity:.88;position:relative;z-index:1}.controls{display:flex;gap:8px;justify-content:center;margin-top:13px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:0;border-radius:12px;font-weight:800;padding:13px 16px;touch-action:manipulation}.small{font-size:.85rem;background:#29233e;color:#fff;border:1px solid #655382;padding:10px 12px;transition:transform .2s,background .2s}.small:hover:not(:disabled){transform:translateY(-2px)}.small[aria-pressed=true]{background:#FFD60A;color:#211330;border-color:#FFD60A}.small:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:34px auto 22px}.primary{background:linear-gradient(110deg,#6D3DFF,#d83ca4);color:#fff;box-shadow:0 7px 25px #6d3dff50}.primary:hover{filter:brightness(1.13)}.secondary{background:#29233e;color:#fff;border:1px solid #655382}.mission{background:linear-gradient(135deg,#29203d,#151c30);border:1px solid #00C9C488;border-radius:20px;padding:25px;max-width:770px;margin:0 auto;box-shadow:0 10px 35px #0004}.mission.ready{box-shadow:0 0 30px #00C9C41b}.mission h2{font-size:.76rem;letter-spacing:.19em;color:#FFD60A;margin:0 0 12px}.mission p{line-height:1.65;font-size:clamp(1rem,2vw,1.2rem);margin:0}.status{text-align:center;color:#d8cbea;font-size:.87rem;min-height:24px;margin-top:16px}footer{text-align:center;color:#b4a9cb;font-size:.78rem;margin-top:38px}.card.flipping{animation:flip .56s cubic-bezier(.2,.8,.2,1) both}@keyframes flip{0%{transform:perspective(900px) rotateY(-88deg) scale(.94);opacity:.3}65%{transform:perspective(900px) rotateY(8deg) scale(1.025);opacity:1}100%{transform:perspective(900px) rotateY(0);opacity:1}}button:focus-visible,.card:focus-visible{outline:3px solid #FFD60A;outline-offset:4px}@media(max-width:600px){main{padding:27px 9px 45px}.deck{gap:7px}.category{letter-spacing:0;margin-bottom:9px}.card{min-height:170px;border-radius:14px;padding:8px;gap:10px}.card:before{inset:5px;border-radius:9px}.card:after{bottom:10px}.card-text{font-size:clamp(.73rem,2.6vw,1rem)}.symbol{font-size:clamp(1.8rem,7vw,2.8rem)}.card-hint{font-size:.58rem}.small{font-size:.71rem;padding:9px 7px}.controls{gap:5px}.actions button{flex:1 1 140px}.sigil{margin:12px 0 19px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.card.illustrated{padding:0;background:#151422}.card.illustrated img{display:block}.card.illustrated::before{display:none!important}
</style>
</head>
<body><main>
<header><div class="eyebrow">PHTALO VIVO PRESENTA</div><h1>El Oráculo Cromático</h1><p>Tres cartas, un desafío. Conserva lo que te inspire y vuelve a mezclar lo demás.</p></header>
<div class="sigil" aria-hidden="true">✦ ◇ ✳</div><section class="deck" id="deck" aria-label="Barajas del oráculo"></section>
<div class="actions"><button class="primary" id="shuffle">✦ Revelar las tres cartas</button><button class="secondary" id="reset">↺ Comenzar de nuevo</button><button class="secondary" id="copy" disabled>Copiar desafío</button></div>
<section class="mission" id="mission" aria-live="polite"><h2>TU MISIÓN CREATIVA</h2><p>Revela las tres cartas para descubrir tu desafío.</p></section><p class="status" id="status" role="status" aria-live="polite"></p>
<footer>Un juego creativo de Phtalo Vivo · Versión 4 · Edición encantada</footer>
</main>
<script id="card-data" type="application/json">[{"name":"Personaje","accent":"#6D3DFF","symbol":"✦","cards":[{"text":"El drágon"},{"text":"El gato"},{"text":"El fantasma"},{"text":"La sirena"},{"text":"El robot"},{"text":"El zorro"},{"text":"La rana"},{"text":"La bruja"}]},{"name":"Escenario","accent":"#00A8A4","symbol":"◇","cards":[{"text":"Un bosque"},{"text":"Una biblioteca"},{"text":"Una ciudad"},{"text":"Un jardín"},{"text":"Un planeta"},{"text":"Un castillo"},{"text":"Una estación de tren"},{"text":"Un mercado"}]},{"name":"Condición creativa","accent":"#FF3DA1","symbol":"✳","cards":[{"text":"Usa solamente tres colores"},{"text":"Ilumina la escena con luz de luna"},{"text":"Dibuja sin líneas de contorno"},{"text":"Incluye un objeto brillante"},{"text":"Utiliza formas geométricas"},{"text":"Trabaja con una paleta cálida"},{"text":"solo puedes usar escala de grises"},{"text":"el color rojo es el protagonista"}]}]</script>
<script>
// Para cambiar el contenido, edita solamente los arreglos "cards".
// Para usar tus ilustraciones después, coloca archivos en la carpeta cartas y agrega
// image: 'cartas/nombre-del-archivo.png' a cada objeto de carta.
const decks=JSON.parse(document.getElementById('card-data').textContent);
const state=decks.map(()=>({index:-1,locked:false}));let animatedCards=new Set();const deckEl=document.querySelector('#deck'),mission=document.querySelector('#mission p'),status=document.querySelector('#status'),shuffle=document.querySelector('#shuffle'),copy=document.querySelector('#copy');
function pick(i){const length=decks[i].cards.length,previous=state[i].index;let next=Math.floor(Math.random()*(length-(previous>=0?1:0)));if(previous>=0&&next>=previous)next++;state[i].index=next;}
function render(){deckEl.replaceChildren();decks.forEach((deck,i)=>{const s=state[i],revealed=s.index>=0,slot=document.createElement('div');slot.className='slot';slot.style.setProperty('--accent',deck.accent);const title=document.createElement('p');title.className='category';title.textContent=deck.name;slot.append(title);const card=document.createElement('button');card.type='button';card.className='card'+(revealed?' revealed':'')+(s.locked?' locked':'')+(animatedCards.has(i)?' flipping':'');card.setAttribute('aria-label',revealed?`${deck.name}: ${deck.cards[s.index].text}`:`Revelar ${deck.name}`);const symbol=document.createElement('span');symbol.className='symbol';symbol.textContent=deck.symbol;const label=document.createElement('span');label.className='card-text';label.textContent=revealed?deck.cards[s.index].text:'Carta misteriosa';const hint=document.createElement('span');hint.className='card-hint';hint.textContent=s.locked?'Carta protegida':revealed?'Toca para cambiar':'Toca para revelar';const art=revealed&&deck.cards[s.index].image;if(art){const img=document.createElement('img');img.src=art;img.alt='';img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0';card.append(img);for(const el of [symbol,label,hint]){el.style.position='relative';el.style.zIndex='1';el.style.textShadow='0 2px 6px #000,0 1px 12px #000'} }if(!art){card.append(symbol,label,hint)}else{card.classList.add("illustrated")}card.disabled=s.locked;card.addEventListener('click',()=>{pick(i);animatedCards=new Set([i]);render()});slot.append(card);const controls=document.createElement('div');controls.className='controls';const change=document.createElement('button');change.className='small';change.textContent='↻ Cambiar';change.disabled=s.locked;change.addEventListener('click',()=>{pick(i);animatedCards=new Set([i]);render()});const lock=document.createElement('button');lock.className='small';lock.textContent=s.locked?'🔒 Fijada':'🔓 Fijar';lock.setAttribute('aria-pressed',String(s.locked));lock.disabled=!revealed;lock.addEventListener('click',()=>{s.locked=!s.locked;render()});controls.append(change,lock);slot.append(controls);deckEl.append(slot)});const ready=state.every(s=>s.index>=0);mission.textContent=ready?`Ilustra ${decks[0].cards[state[0].index].text.toLowerCase()} en ${decks[1].cards[state[1].index].text.toLowerCase()}. ${decks[2].cards[state[2].index].text}.`:'Revela las tres cartas para descubrir tu desafío.';copy.disabled=!ready;document.querySelector('#mission').classList.toggle('ready',ready);shuffle.textContent=state.every(s=>s.index<0)?'✦ Revelar las tres cartas':'✦ Mezclar cartas sin fijar';}
shuffle.addEventListener('click',()=>{let changed=0;animatedCards=new Set();state.forEach((s,i)=>{if(!s.locked){pick(i);changed++;animatedCards.add(i)}});status.textContent=changed?'¡El oráculo ha hablado!': 'Las tres cartas están fijadas. Desbloquea alguna para mezclar.';render()});document.querySelector('#reset').addEventListener('click',()=>{state.forEach(s=>{s.index=-1;s.locked=false});animatedCards=new Set();status.textContent='Nueva partida lista.';render()});copy.addEventListener('click',async()=>{const message=`El Oráculo Cromático — Phtalo Vivo\nPersonaje: ${decks[0].cards[state[0].index].text}\nEscenario: ${decks[1].cards[state[1].index].text}\nCondición creativa: ${decks[2].cards[state[2].index].text}`;try{await navigator.clipboard.writeText(message);status.textContent='Desafío copiado.'}catch{status.textContent='No se pudo copiar automáticamente en este navegador.'}});render();
</script></body></html>
